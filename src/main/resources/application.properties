# =============================================================================
# Daily Status Report Web — Application settings
# =============================================================================

spring.application.name=daily-status-report-web

# Port for the embedded Tomcat server (change if 8081 is also in use)
server.port=8081

# Open browser automatically when app starts (set false for tests/CI)
app.browser.auto-open=true
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.statusreport.DailyStatusReportWebApplication=INFO
#logging.level.org.springframework=DEBUG